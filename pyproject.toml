[project]
name = "skill-manager"
version = "0.1.0"
description = "Project-scoped declarative skill manager for pi agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
skill-manager = "skill_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_manager"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PIE", "RUF", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
