[project]
name = "cnife-skill-manager"
dynamic = ["version"]
description = "Project-scoped declarative skill manager for agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CNife", email = "CNife@vip.qq.com" },
]
keywords = ["skills", "agents", "cli", "xdg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/CNife/skill-manager"
Repository = "https://github.com/CNife/skill-manager"
Issues = "https://github.com/CNife/skill-manager/issues"

[project.scripts]
skill-manager = "skill_manager.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/skill_manager/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_manager"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "C4", "I", "PIE", "RUF", "S", "SIM", "UP", "W"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
